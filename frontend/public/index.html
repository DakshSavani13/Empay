<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmPay - Modern HRMS & Payroll</title>
  
  <!-- Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/premium-styles.css">
</head>
<body>

  <!-- Animated Background Orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div id="app" class="app-container">
    
    <!-- AUTHENTICATION PAGE -->
    <div id="loginPage" class="auth-page">
      <div class="auth-wrapper">
        <div class="glass-card auth-card">
          <div class="auth-header">
            <div class="auth-logo-wrapper">
              <div class="ep-logo">
                <span class="ep-logo-text">EP</span>
                <div class="ep-logo-dot"></div>
              </div>
            </div>
            <div class="auth-brand-name">Em<span class="gradient-text">Pay</span></div>
            <h1 id="authTitle" style="font-size: 1.4rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.25rem;">Welcome Back</h1>
            <p id="authSubtitle" class="text-muted">Sign in to your EmPay account</p>
          </div>

          <div id="authAlert" class="auth-alert hidden"></div>

          <!-- Login Form -->
          <form id="loginForm" class="modern-form">
            <div class="form-group text-left">
              <label class="form-label">Email or Employee Code</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="text" id="loginEmail" class="form-control" placeholder="john@example.com" required>
              </div>
            </div>
            <div class="form-group text-left">
              <label class="form-label">Password</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
              </div>
            </div>
            <button type="submit" id="loginBtn" class="btn btn-primary btn-glow" style="width: 100%; margin-top: 1rem;">
              <span class="btn-text">Sign In</span>
              <div class="btn-shine"></div>
            </button>
            <div id="switchToSignupText" class="auth-switch-text">
              Don't have an account? <a href="#" id="showSignup" class="auth-link">Contact Admin</a>
            </div>

          </form>

          <!-- Signup Form -->
          <form id="signupForm" class="modern-form hidden">
            <div class="form-group text-left">
              <label class="form-label">Company Name</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-building input-icon"></i>
                <input type="text" id="signupCompany" class="form-control" placeholder="Acme Corp" required>
              </div>
            </div>
            <div class="form-group text-left">
              <label class="form-label">Full Name</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="signupName" class="form-control" placeholder="John Doe" required>
              </div>
            </div>
            <div class="form-group text-left">
              <label class="form-label">Email Address</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="signupEmail" class="form-control" placeholder="john@example.com" required>
              </div>
            </div>
            <div class="form-group text-left">
              <label class="form-label">Phone</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-phone input-icon"></i>
                <input type="tel" id="signupPhone" class="form-control" placeholder="+1 234 567 8900" required>
              </div>
            </div>
            <div class="form-group text-left">
              <label class="form-label">Password</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="signupPassword" class="form-control" placeholder="••••••••" required>
              </div>
            </div>
            <div class="form-group text-left">
              <label class="form-label">Confirm Password</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="signupConfirmPassword" class="form-control" placeholder="••••••••" required>
              </div>
            </div>
            <button type="submit" id="signupBtn" class="btn btn-primary btn-glow" style="width: 100%; margin-top: 1rem;">
              <span class="btn-text">Create Account</span>
              <div class="btn-shine"></div>
            </button>
            <div id="switchToLoginText" class="auth-switch-text hidden">
              Already have an account? <a href="#" id="showLogin" class="auth-link">Sign In</a>
            </div>
          </form>

        </div>
      </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="appContainer" class="hidden app-layout" style="width: 100%; height: 100%; display: flex;">
      
      <!-- Sidebar -->
      <aside class="sidebar glass-sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo" style="display: flex; align-items: center; gap: 0.6rem;">
            <div class="sidebar-ep-logo">
              <span>EP</span>
            </div>
            <span class="gradient-text" style="font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px;">EmPay</span>
          </div>
        </div>
        <div class="sidebar-user" style="display: none;">
            <div id="userAvatarSidebar" class="avatar">--</div>
            <div class="user-info">
                <div id="sidebarUserName" class="name">--</div>
                <div id="sidebarUserRole" class="role">--</div>
            </div>
        </div>
        <ul class="sidebar-menu" id="sidebarNav">
          <!-- Dynamically populated by app.js based on role -->
        </ul>
      </aside>

      <!-- Main Content Container -->
      <main class="main-content">
        <!-- Topbar -->
        <header class="topbar glass-topbar" id="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="menu-toggle glass-btn">
              <i class="fas fa-bars"></i>
            </button>
            <button id="mobileMenuBtn" class="menu-toggle glass-btn mobile-only" style="display:none;">
              <i class="fas fa-bars"></i>
            </button>
            <div id="pageTitle" class="page-title">Workspace</div>
            <div class="header-date" style="margin-left: 1rem; font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem;">
              <i class="fas fa-calendar-day"></i> <span id="headerDate"></span>
            </div>
          </div>
          
          <div class="topbar-right" style="display: flex; align-items: center; gap: 0.75rem;">
            
            <div class="user-profile glass-pill" onclick="navigateTo('profile')" style="cursor: pointer; display: flex; align-items: center; gap: 0.75rem; padding: 0.35rem 0.35rem 0.35rem 1rem;">
              <div class="user-info" style="text-align: right; line-height: 1.3;">
                <div class="name" id="headerUserName" style="font-weight: 600; font-size: 0.875rem; color: var(--text-main); white-space: nowrap;">Loading...</div>
                <div class="role" id="headerUserRole" style="font-size: 0.72rem; color: var(--text-muted); text-transform: capitalize; white-space: nowrap;">--</div>
              </div>
              <div class="user-avatar gradient-avatar" id="headerAvatar" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.875rem; color: white; flex-shrink: 0;">
                AU
              </div>
            </div>

            <button id="logoutBtn" class="btn btn-icon glass-btn" style="color: var(--danger-color); width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;" title="Logout">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </div>
        </header>

        <!-- Dynamic Content Area -->
        <div class="content-area" id="contentArea">
          <!-- Views injected here by JS -->
        </div>
      </main>

    </div>
  </div>

  <!-- Third Party Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Scripts -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/attendance.js"></script>
  <script src="assets/js/leave.js"></script>
  <script src="assets/js/payroll.js"></script>
  <script src="assets/js/employees.js"></script>
  <script src="assets/js/profile.js"></script>
  <script src="assets/js/settings.js"></script>
  <script src="assets/js/reports.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
